<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
</head>
<body>
    <form name="form_search" action="https://google.com/search" method="get">
        <fieldset>
            <legend>GOOGLE SEARCH</legend>
            <label for="t_string">Text:</label>
            <input type="text" name="q" id="t_string" required>
            <input type="submit" id="b_send" value="Search">
        </fieldset>
    </form>
    
</body>
</html>
